<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — CRM SE LOGER CM</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { visibility: hidden; }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: var(--bg-1);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-0);
      border: 1px solid var(--border-1);
      border-radius: 10px;
      padding: var(--space-5);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-5);
    }
    .login-mark {
      width: 38px; height: 38px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .login-title { font-size: 17px; font-weight: 600; line-height: 1.2; }
    .login-sub   { font-size: 12px; color: var(--fg-2); }

    .login-card label {
      display: block;
      font-size: 12px;
      color: var(--fg-1);
      margin-bottom: var(--space-1);
    }
    .login-card input {
      width: 100%;
      margin-bottom: var(--space-4);
    }
    .login-card button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-card button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }
    .login-card button[type="submit"]:disabled { opacity: .6; cursor: default; }
    .login-card button[type="submit"]:focus-visible,
    .login-card input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .login-error {
      display: none;
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      border-radius: 6px;
      padding: var(--space-3);
      font-size: 13px;
      margin-bottom: var(--space-4);
    }
    .login-error.show { display: block; }
    .login-foot {
      margin-top: var(--space-4);
      font-size: 11px;
      color: var(--fg-3);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark">SL</div>
        <div>
          <div class="login-title">CRM SE LOGER CM</div>
          <div class="login-sub">Accès réservé</div>
        </div>
      </div>

      <div class="login-error" id="loginError" role="alert"></div>

      <form id="loginForm" novalidate>
        <label for="email">Adresse email</label>
        <input type="email" id="email" autocomplete="username" required autofocus>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit" id="loginBtn">Se connecter</button>
      </form>

      <div class="login-foot">Session conservée sur cet appareil.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
  (function () {
    'use strict';
    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('loginBtn');
    const box  = document.getElementById('loginError');

    function fail(msg) {
      box.textContent = msg;
      box.classList.add('show');
    }

    /* Messages Supabase traduits : "Invalid login credentials" n'aide personne. */
    function describe(err) {
      const m = (err && err.message) || '';
      if (/invalid login credentials/i.test(m)) return 'Email ou mot de passe incorrect.';
      if (/email not confirmed/i.test(m))       return 'Adresse email non confirmée.';
      if (/rate limit|too many/i.test(m))       return 'Trop de tentatives. Réessaie dans quelques minutes.';
      if (/network|fetch/i.test(m))             return 'Connexion indisponible. Vérifie ton réseau.';
      return m || 'Connexion impossible.';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      box.classList.remove('show');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { fail('Renseigne ton email et ton mot de passe.'); return; }

      btn.disabled = true;
      btn.textContent = 'Connexion…';

      try {
        const client = window.SLCM_DB.getClient();
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const next = new URLSearchParams(window.location.search).get('next');
        window.location.replace(next || 'index.html');
      } catch (err) {
        console.error('[login]', err);
        fail(describe(err));
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  })();
  </script>
</body>
</html>
