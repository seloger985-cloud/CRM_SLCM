<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repères — SE LOGER CM</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .rp-wrap{max-width:680px;margin:0 auto;padding:12px 14px 120px}
  .rp-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .rp-top h1{font-size:1.02rem;margin:0;flex:1}
  .rp-btn{background:none;border:1px solid var(--border);border-radius:9px;
          padding:7px 11px;cursor:pointer;color:inherit;font-size:.84rem}

  .rp-prog{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .rp-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .rp-compte{font-size:.78rem;color:var(--text-2,#777);margin-bottom:14px}

  .rp-q{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
  .rp-q button{white-space:nowrap;padding:7px 12px;border:1px solid var(--border);
      background:var(--bg-input);border-radius:999px;cursor:pointer;font-size:.8rem;color:inherit}
  .rp-q button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .rp-bien{border:1px solid var(--border);border-radius:14px;overflow:hidden;
           background:var(--bg-input);margin-bottom:14px}
  .rp-bien img{width:100%;height:190px;object-fit:cover;display:block;background:#ddd}
  .rp-bien .c{padding:12px 14px}
  .rp-bien h2{font-size:.98rem;margin:0 0 3px;line-height:1.3}
  .rp-bien .m{font-size:.8rem;color:var(--text-2,#777)}
  .rp-bien .px{color:var(--accent);font-weight:700;font-size:.92rem;margin-top:4px}
  .rp-actuel{margin-top:8px;font-size:.82rem;font-style:italic;color:var(--text-2,#777);
             border-left:2px solid var(--accent);padding-left:8px}

  .rp-lbl{font-size:.75rem;color:var(--text-2,#777);margin:14px 0 6px}
  .rp-chips{display:flex;flex-wrap:wrap;gap:6px}
  .rp-chips button{padding:7px 11px;border:1px solid var(--border);background:var(--bg-input);
      border-radius:999px;cursor:pointer;font-size:.8rem;color:inherit;text-align:left}
  .rp-chips button:active{transform:scale(.97)}
  #rpTexte{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;
      background:var(--bg-input);color:inherit;font-size:.95rem;margin-top:10px}
  .rp-aide{font-size:.76rem;color:var(--text-2,#777);line-height:1.45;margin-top:8px}

  .rp-barre{position:fixed;left:0;right:0;bottom:0;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
      background:var(--bg-0,#fff);border-top:1px solid var(--border);display:flex;gap:9px}
  .rp-barre button{padding:13px;border:0;border-radius:11px;font-weight:700;font-size:.92rem;cursor:pointer}
  .rp-go{flex:1;background:var(--accent);color:#fff}
  .rp-go:disabled{opacity:.45}
  .rp-skip{background:var(--bg-input);color:inherit;border:1px solid var(--border)!important}
  .rp-vide{text-align:center;padding:40px 12px;color:var(--text-2,#777);font-size:.9rem}
</style>
</head>
<body>
<div class="rp-wrap">
  <div class="rp-top">
    <h1 id="rpTitre">Repères</h1>
    <button class="rp-btn" onclick="location.href='index.html'">CRM</button>
  </div>
  <div id="rpVue"><div class="rp-vide">Chargement…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/ui.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Saisie des repères — une annonce à la fois.

   Le repère situe un bien comme on le dit ici : « à une moto du carrefour »,
   « près de la Clinique de l'aéroport ». Il s'affiche déjà sur les cartes et
   les fiches, il alimentera les pages de quartier.

   Pourquoi cette page plutôt que le dashboard : 148 annonces à traiter, et
   la qualité de la saisie compte autant que le fait de saisir. Un champ
   libre a produit « H », « Denver », « Tradex » — des noms de lieux qui
   n'indiquent rien. Ici, les repères DÉJÀ employés dans le quartier sont
   proposés en pastilles : on touche, c'est écrit, c'est cohérent.

   L'écriture passe par listing-set-repere, qui valide la session CRM côté
   serveur. Aucun secret ne descend dans le navigateur.
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var SITE = 'https://selogercm.com';
  var MINI = 14;                     /* en dessous, le repère n'indique rien */
  var vue = document.getElementById('rpVue');
  var titre = document.getElementById('rpTitre');
  var biens = [], parQuartier = {}, connus = {}, quartier = null, i = 0, faits = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function q(b) {
    var d = (b.district || '').trim();
    if (d) return d;
    var p = (b.slug || '').split('-');
    return p.length > 2 ? p[1].charAt(0).toUpperCase() + p[1].slice(1) : 'Autre';
  }

  async function charger() {
    var tout = await window.SLCM_SITE.fetchListings({ force: true });
    tout = tout || [];
    /* Les repères déjà valides d'un quartier deviennent les propositions de
       ce quartier : la carte se construit toute seule, et se resserre. */
    connus = {};
    tout.forEach(function (b) {
      var r = (b.repere || '').trim();
      if (r.length >= MINI) {
        (connus[q(b)] = connus[q(b)] || {})[r] = (connus[q(b)][r] || 0) + 1;
      }
    });
    biens = tout.filter(function (b) { return (b.repere || '').trim().length < MINI; });
    parQuartier = {};
    biens.forEach(function (b) { (parQuartier[q(b)] = parQuartier[q(b)] || []).push(b); });
    quartier = Object.keys(parQuartier).sort(function (a, c) {
      return parQuartier[c].length - parQuartier[a].length;
    })[0] || null;
    i = 0;
    dessiner();
  }

  function dessiner() {
    if (!quartier) {
      vue.innerHTML = '<div class="rp-vide">Tout est renseigné. Rien à faire ici.</div>';
      return;
    }
    var liste = parQuartier[quartier] || [];
    var onglets = Object.keys(parQuartier).sort(function (a, c) {
      return parQuartier[c].length - parQuartier[a].length;
    }).map(function (k) {
      return '<button data-q="' + esc(k) + '" class="' + (k === quartier ? 'on' : '') + '">'
        + esc(k) + ' <b>' + parQuartier[k].length + '</b></button>';
    }).join('');

    if (i >= liste.length) {
      vue.innerHTML = '<div class="rp-q">' + onglets + '</div>'
        + '<div class="rp-vide">' + esc(quartier) + ' est terminé.<br>'
        + 'Choisissez un autre quartier ci-dessus.</div>';
      brancherOnglets();
      return;
    }

    var b = liste[i];
    var img = (b.images || [])[0] || '';
    var actuel = (b.repere || '').trim();
    var props = Object.keys(connus[quartier] || {})
      .sort(function (a, c) { return connus[quartier][c] - connus[quartier][a]; })
      .slice(0, 10);
    var reste = biens.length - faits;

    vue.innerHTML = '<div class="rp-q">' + onglets + '</div>'
      + '<div class="rp-prog"><i style="width:' + Math.round(100 * i / liste.length) + '%"></i></div>'
      + '<p class="rp-compte">' + esc(quartier) + ' — ' + (i + 1) + ' sur ' + liste.length
      + ' &middot; ' + reste + ' au total</p>'
      + '<div class="rp-bien">'
      + (img ? '<img src="' + esc(img) + '" alt="">' : '')
      + '<div class="c"><h2>' + esc(b.title || b.slug) + '</h2>'
      + '<p class="m">' + esc(q(b)) + (b.type ? ' &middot; ' + esc(b.type) : '') + '</p>'
      + (b.price ? '<p class="px">' + Number(b.price).toLocaleString('fr-FR') + ' F</p>' : '')
      + (actuel ? '<p class="rp-actuel">Actuel : ' + esc(actuel) + '</p>' : '')
      + '</div></div>'
      + (props.length ? '<p class="rp-lbl">Repères déjà employés à ' + esc(quartier) + '</p>'
          + '<div class="rp-chips">' + props.map(function (p) {
              return '<button data-p="' + esc(p) + '">' + esc(p) + '</button>';
            }).join('') + '</div>' : '')
      + '<input id="rpTexte" placeholder="Près de… / À 1 moto de… / En bordure de…" '
      + 'value="' + esc(actuel) + '">'
      + '<p class="rp-aide">Écrivez une <b>indication</b>, pas un nom seul. '
      + '« Tradex » ne dit rien ; « Près de Tradex » situe. '
      + 'Au moins ' + MINI + ' caractères.</p>'
      + '<div class="rp-barre"><button class="rp-skip" id="rpSkip">Passer</button>'
      + '<button class="rp-go" id="rpGo">Enregistrer</button></div>';

    var champ = document.getElementById('rpTexte');
    var go = document.getElementById('rpGo');
    function maj() { go.disabled = champ.value.trim().length < MINI; }
    champ.addEventListener('input', maj); maj();
    champ.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !go.disabled) enregistrer(b, champ.value);
    });
    vue.querySelectorAll('.rp-chips button').forEach(function (x) {
      x.onclick = function () { champ.value = x.dataset.p; maj(); champ.focus(); };
    });
    go.onclick = function () { enregistrer(b, champ.value); };
    document.getElementById('rpSkip').onclick = function () { i++; dessiner(); };
    brancherOnglets();
  }

  function brancherOnglets() {
    vue.querySelectorAll('.rp-q button').forEach(function (x) {
      x.onclick = function () { quartier = x.dataset.q; i = 0; dessiner(); };
    });
  }

  async function enregistrer(b, valeur) {
    var go = document.getElementById('rpGo');
    go.disabled = true; go.textContent = 'Envoi…';
    try {
      var sess = (await window.SLCM_DB.getClient().auth.getSession()).data.session;
      var r = await fetch(SITE + '/.netlify/functions/listing-set-repere', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + (sess && sess.access_token)
        },
        body: JSON.stringify({ slug: b.slug, repere: valeur.trim() })
      });
      var j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      /* On enrichit la liste des propositions au fil de l'eau : le repère
         qu'on vient d'écrire est proposé au bien suivant du même quartier. */
      var k = q(b);
      connus[k] = connus[k] || {};
      connus[k][valeur.trim()] = (connus[k][valeur.trim()] || 0) + 1;
      b.repere = valeur.trim();
      faits++; i++;
      window.UI.toast('Enregistré', 'success');
      dessiner();
    } catch (e) {
      go.disabled = false; go.textContent = 'Enregistrer';
      window.UI.toast('Échec : ' + ((e && e.message) || e), 'error');
    }
  }

  document.addEventListener('slcm:auth-ready', charger);
  if (window.SLCM_SESSION) charger();
})();
</script>
</body>
</html>
